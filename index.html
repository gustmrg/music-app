<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Music</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <!-- ══════════ Sidebar ══════════ -->
  <aside class="sidebar">
    <div class="logo-row">
      <span class="logo-glyph">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="#fff" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </span>
      <span class="logo-text">Cloud Music</span>
    </div>

    <nav class="side-nav" id="sideNav">
      <a class="nav-item active" data-view="featured">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" opacity=".9"/></svg></span>
        <span>Featured</span>
      </a>
      <a class="nav-item" data-view="radio">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M7.7 16.3a6 6 0 0 1 0-8.6M16.3 7.7a6 6 0 0 1 0 8.6M5 19a10 10 0 0 1 0-14M19 5a10 10 0 0 1 0 14"/></svg></span>
        <span>Radio</span>
      </a>
      <a class="nav-item" data-view="follow">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 12a4.2 4.2 0 1 0-4.2-4.2A4.2 4.2 0 0 0 12 12zm0 2c-3.6 0-7 1.8-7 4.4V20h14v-1.6c0-2.6-3.4-4.4-7-4.4z"/></svg></span>
        <span>Following</span>
      </a>
    </nav>

    <nav class="side-nav group2" id="sideNav2">
      <a class="nav-item" data-view="liked">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 21s-7.5-4.7-9.7-9A5.6 5.6 0 0 1 12 6.2 5.6 5.6 0 0 1 21.7 12c-2.2 4.3-9.7 9-9.7 9z"/></svg></span>
        <span>Liked Music</span>
        <span class="nav-badge"><svg viewBox="0 0 24 24" width="12" height="12"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="m9 6 6 6-6 6"/></svg></span>
      </a>
      <a class="nav-item" data-view="recent">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 7.5V12l3 2"/></svg></span>
        <span>Recently Played</span>
      </a>
      <a class="nav-item" data-view="download">
        <span class="nav-ico"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M11 3h2v8.2l2.6-2.6 1.4 1.4-5 5-5-5 1.4-1.4L11 11.2zM4 19h16v2H4z"/></svg></span>
        <span>Downloads</span>
      </a>
    </nav>

    <div class="side-playlists">
      <div class="side-playlists-head">
        <span class="muted">Created Playlists <em id="playlistCount">1</em></span>
        <button class="icon-round" title="New playlist"><svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      </div>
      <a class="side-pl-item" id="myFirstPlaylist">
        <span class="side-pl-cover" id="myPlCover"></span>
        <span class="side-pl-name">My Music Pocket</span>
      </a>
    </div>

    <div class="login-card" id="loginCard">
      <div class="login-main">Sign in to Cloud Music <svg viewBox="0 0 24 24" width="11" height="11"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="m9 6 6 6-6 6"/></svg></div>
      <div class="login-sub"><svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="currentColor" d="M12 7v5l3.2 1.9-.8 1.3L11 12.6V7z"/></svg><span id="loginSubText">Full tracks free in every section</span></div>
    </div>
  </aside>

  <!-- ══════════ Main ══════════ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-circle" id="btnBack" title="Back"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="m14 6-6 6 6 6"/></svg></button>
        <button class="icon-circle dim" id="btnFwd" title="Forward"><svg viewBox="0 0 24 24" width="14" height="14"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="m10 6 6 6-6 6"/></svg></button>
        <div class="search-pill">
          <svg class="search-ico" viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m16 16 4.2 4.2"/></svg>
          <span class="search-flame">🔥</span>
          <input id="searchInput" type="text" placeholder="" autocomplete="off">
          <span class="search-hint" id="searchHint">Trending: Insomnia</span>
        </div>
        <button class="icon-circle" title="Identify song"><svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5.3-3a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9z"/></svg></button>
      </div>
      <div class="topbar-right">
        <div class="user-chip" id="userChip">
          <span class="avatar-circle"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 12a4.2 4.2 0 1 0-4.2-4.2A4.2 4.2 0 0 0 12 12zm0 2c-3.6 0-7 1.8-7 4.4V20h14v-1.6c0-2.6-3.4-4.4-7-4.4z"/></svg></span>
          <span class="user-name">Sign In</span>
          <span class="crown-badge"><svg viewBox="0 0 24 24" width="11" height="11"><path fill="#f5c451" d="M3 8l4.5 3L12 5l4.5 6L21 8l-1.6 9H4.6z"/></svg><i>VIP</i></span>
          <svg class="chev" viewBox="0 0 24 24" width="12" height="12"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="m6 9 6 6 6-6"/></svg>
        </div>
        <button class="icon-plain" title="Messages"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 6h16v11H8.8L5 20.2V17H4z"/><path fill="currentColor" d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button class="icon-plain" title="Settings"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="m19.4 13 .1-1-.1-1 2-1.5-2-3.4-2.3.9a7 7 0 0 0-1.7-1L14.9 3h-3.8l-.5 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5L6.6 11l-.1 1 .1 1-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 1.7 1l.5 2.5h3.8l.5-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
        <button class="icon-plain has-dot" title="Themes"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M6 4h12l2 5a3.4 3.4 0 0 1-2.2 3.2V20H8.2v-7.8A3.4 3.4 0 0 1 6 9zM4 20h16v2H4z" opacity=".9"/></svg><i class="red-dot"></i></button>
        <button class="icon-plain" title="Minimize"><svg viewBox="0 0 24 24" width="17" height="17"><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 12h14"/></svg></button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <section class="content" id="content"></section>
  </main>

  <!-- Queue drawer -->
  <aside class="queue-drawer" id="queueDrawer">
    <div class="queue-head">
      <span class="queue-title">Play Queue <em id="queueCount">0</em></span>
      <span class="queue-actions">
        <a id="favAll"><svg viewBox="0 0 24 24" width="13" height="13"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 4h14v16H5z"/><path fill="currentColor" d="M9 9h6M9 13h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Save All</a>
        <a id="clearQueue"><svg viewBox="0 0 24 24" width="13" height="13"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 7h14M9 7V5h6v2m-8 0 1 13h8l1-13"/></svg> Clear</a>
      </span>
    </div>
    <div class="queue-list" id="queueList"></div>
  </aside>

  <!-- ══════════ Player bar ══════════ -->
  <footer class="player-bar" id="playerBar">
    <div class="progress-line" id="progressLine">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-knob" id="progressKnob"></div>
      <div class="progress-tip" id="progressTip">0:00</div>
    </div>
    <div class="player-left">
      <div class="player-cover" id="playerCover"></div>
      <div class="player-meta">
        <div class="player-title-row">
          <span class="player-title" id="playerTitle">—</span>
        </div>
        <div class="player-artist" id="playerArtist"></div>
      </div>
      <button class="pl-mini" id="btnLike" title="Like">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 20s-6.8-4.3-8.8-8.2A5 5 0 0 1 12 6.6 5 5 0 0 1 20.8 11.8C18.8 15.7 12 20 12 20z"/></svg>
        <em>100k+</em>
      </button>
      <button class="pl-mini" id="btnComment" title="Comments">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 5h16v11H9.5L5.5 19.5V16H4z"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/><circle cx="12.5" cy="10.5" r="1" fill="currentColor"/><circle cx="16" cy="10.5" r="1" fill="currentColor"/></svg>
        <em>999+</em>
      </button>
    </div>
    <div class="player-center">
      <button class="pl-ctl" id="btnMode" title="Play mode">
        <svg id="modeIcon" viewBox="0 0 24 24" width="18" height="18"></svg>
      </button>
      <button class="pl-ctl" id="btnPrev" title="Previous"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 6h2v12H7zm11 0v12l-9-6z"/></svg></button>
      <button class="play-toggle" id="btnPlay" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18"></svg>
      </button>
      <button class="pl-ctl" id="btnNext" title="Next"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15 6h2v12h-2zM6 6v12l9-6z"/></svg></button>
      <button class="pl-ctl" id="btnQueue" title="Play queue"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h2v2H4zM8 6.4h12v1.8H8zM4 11h2v2H4zM8 11.4h12v1.8H8zM4 16h2v2H4zM8 16.4h7v1.8H8z"/></svg></button>
    </div>
    <div class="player-right">
      <span class="quality-badge">ULTRA</span>
      <button class="pl-ctl" title="Sound effects"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 12h2m3-5v10m4-14v18m4-14v10m3-7v4"/></svg></button>
      <button class="pl-ctl" title="Lyrics"><svg viewBox="0 0 24 24" width="17" height="17"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M8 9.5h8M8 13h5"/></svg></button>
      <div class="volume-wrap" id="volumeWrap">
        <button class="pl-ctl" id="btnVolume" title="Volume"><svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M4 9v6h3.5L13 20V4L7.5 9zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6z"/></svg></button>
        <div class="volume-slider"><div class="volume-fill" id="volumeFill"></div></div>
      </div>
      <button class="pl-ctl" title="More"><svg viewBox="0 0 24 24" width="17" height="17"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
</div>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
